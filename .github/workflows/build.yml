name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: |
            dist_assets
            ci_cache
          key: models-v1-${{ hashFiles('build/prepare_models.py') }}

      - name: Prepare models (speech, translation, llama-server)
        run: |
          pip install "transformers<5" huggingface_hub sacremoses torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          python build/prepare_models.py dist_assets

      - name: Make test recording
        shell: python
        run: |
          import numpy as np, soundfile as sf, glob
          parts = []
          for w in ["dist_assets/test_wavs/0.wav", "dist_assets/test_wavs/1.wav"]:
              a, sr = sf.read(w, dtype="float32")
              parts += [a, np.zeros(sr, dtype="float32")]
          sf.write("dist_assets/lecture.wav", np.concatenate(parts), 16000)

      - name: Download summary model for testing
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci_cache | Out-Null
          $f = "ci_cache/qwen2.5-1.5b-instruct-q4_k_m.gguf"
          if (-not (Test-Path $f)) {
            Invoke-WebRequest "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf" -OutFile $f
          }
          Copy-Item $f dist_assets/models/ -Force

      - name: Smoke test (recognition + translation + local summary)
        env:
          CI_MODELS_DIR: ${{ github.workspace }}\dist_assets\models
          LLAMA_SERVER: ${{ github.workspace }}\dist_assets\bin\llama\llama-server.exe
          TEST_WAV: ${{ github.workspace }}\dist_assets\lecture.wav
          SUMMARY: "1"
        run: python tests/smoke_test.py

      - name: Remove test-only files from the bundle
        shell: pwsh
        run: Remove-Item dist_assets/models/*.gguf -Force

      - name: Build app
        run: pyinstaller build/ClassInterpreter.spec --noconfirm

      - name: Check built app starts its engine
        shell: pwsh
        run: |
          $env:CI_SELFTEST = "1"
          $p = Start-Process dist/ClassInterpreter/ClassInterpreter.exe -PassThru -Wait -ArgumentList "--selftest"
          if ($p.ExitCode -ne 0) { Get-Content $env:LOCALAPPDATA/ClassInterpreter/selftest.log; exit 1 }
          Get-Content $env:LOCALAPPDATA/ClassInterpreter/selftest.log

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = "${{ github.ref_name }}" -replace '^v',''
          if ($ver -notmatch '^\d') { $ver = "0.1.${{ github.run_number }}" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" build/installer.iss
          Get-ChildItem release

      - uses: actions/upload-artifact@v4
        with:
          name: ClassInterpreter-Setup
          path: release/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          body: |
            下载下面的 `ClassInterpreter-Setup-*.exe`，双击安装即可（Windows 10/11, 64 位）。
            第一次打开时 Windows 可能提示“已保护你的电脑”，点“更多信息 → 仍要运行”。
